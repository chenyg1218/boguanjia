[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "boguanjia"
version = "1.1.2"
description = "播管家 — 多平台直播跟播辅助"
readme = "README.md"
requires-python = ">=3.8,<3.9"
dependencies = ["PySide2>=5.15.2", "certifi>=2023.7.22"]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pyinstaller>=5.13,<7"]

[project.scripts]
boguanjia = "boguanjia.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
