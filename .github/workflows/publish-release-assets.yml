name: Publish Release Assets

# 从已成功的构建 run 拉取产物并创建 GitHub Release（避免本机下载失败 / flatten 路径问题）
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Actions run id that contains windows-release / macos-release artifacts
        required: true
        type: string
      tag:
        description: Release tag (must already exist)
        required: true
        default: v1.1.2
        type: string

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Download artifacts from build run
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-assets

      - name: Flatten artifacts
        shell: bash
        run: |
          mkdir -p dist-release
          find release-assets -type f \( -name '*.exe' -o -name '*.exe.blockmap' -o -name 'latest.yml' -o -name '*.dmg' -o -name 'latest-mac.yml' \) -exec cp -v {} dist-release/ \;
          ls -lah dist-release
          test -n "$(ls -A dist-release)"

      - name: Extract changelog
        id: changelog
        working-directory: desktop
        shell: bash
        run: |
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          node scripts/extract-changelog.js >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          body: ${{ steps.changelog.outputs.notes }}
          files: dist-release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
