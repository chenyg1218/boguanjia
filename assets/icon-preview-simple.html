<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>播管家图标 · 光圈智播色系</title>
  <style>
    body {
      margin: 0; min-height: 100vh; padding: 32px;
      background: #111; color: #eee;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { color: #999; font-size: 13px; margin: 0 0 24px; line-height: 1.5; }
    .row { display: flex; flex-wrap: wrap; gap: 20px; align-items: end; }
    .box { text-align: center; }
    .box span { display: block; margin-top: 8px; font-size: 12px; color: #888; }
    .s512, .s128, .s64, .s32 {
      border-radius: 22%; overflow: hidden; background: #000;
      box-shadow: 0 8px 24px rgba(0,0,0,.5);
    }
    .s512 { width: 220px; height: 220px; }
    .s128 { width: 128px; height: 128px; }
    .s64 { width: 64px; height: 64px; }
    .s32 { width: 32px; height: 32px; }
    img { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <h1>F1 + C 形 · 光圈智播色系</h1>
  <p>黑底 · 白芯图形 · 青→紫霓虹光晕。造型仍是左开 C + 播放键。</p>
  <div class="row">
    <div class="box"><div class="s512"><img src="icon.png" alt="512" /></div><span>大图标</span></div>
    <div class="box"><div class="s128"><img src="icon.png" alt="128" /></div><span>128</span></div>
    <div class="box"><div class="s64"><img src="icon.png" alt="64" /></div><span>64</span></div>
    <div class="box"><div class="s32"><img src="icon.png" alt="32" /></div><span>32</span></div>
  </div>
</body>
</html>
