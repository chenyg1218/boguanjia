server {
    server_name license.sugaiming.com;

    # 播管家独立核销（独立 DB · :8081）
    location /bgj/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 金豆核销（独立 DB · :8080）
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/license.sugaiming.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/license.sugaiming.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = license.sugaiming.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name license.sugaiming.com;
    return 404; # managed by Certbot
}
